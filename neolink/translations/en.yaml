configuration:
  log_level:
    name: Log level
    description: Verbosity of the add-on log.
  bind:
    name: Bind address
    description: Interface the RTSP server binds to (0.0.0.0 = all).
  bind_port:
    name: RTSP port
    description: Port for the RTSP server (default 8558; avoid 8554 — used by HA's built-in go2rtc).
  offline_timeout_secs:
    name: Offline timeout (seconds)
    description: >-
      Global default: how long a viewer keeps seeing the black + silent-audio
      placeholder while a camera is offline before that viewer's stream is dropped
      (so Home Assistant can mark it unavailable / trigger automations). 0 = never
      (default — the placeholder is held indefinitely and recovers on its own when
      the camera returns). Must exceed your camera's reboot time; values 1-59 are
      raised to a 60s floor. Override per camera under a camera's optional settings.
  certificate:
    name: TLS certificate
    description: Path to a PEM (cert + key) to enable rtsps://. Optional.
  tls_client_auth:
    name: TLS client auth
    description: Require a client certificate (none / request / require).
  rtsp_users:
    name: RTSP users
    description: Username/password accounts for RTSP. Empty = anonymous.
  mqtt:
    name: MQTT
    description: MQTT integration. Leave overrides empty to use the HA broker.
  cameras:
    name: Cameras
    description: One entry per camera. Use uid (P2P) or address (ip:9000).
